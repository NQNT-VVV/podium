# Identifiants Discord OAuth2 — MODELE, ne jamais commiter les vraies valeurs.
#
# Cree une application sur https://discord.com/developers/applications, onglet
# OAuth2 : recupere le Client ID et le Client Secret, et declare la redirection
#   https://podium.danwalex.com/api/auth/discord/callback
#
# Renseigne le secret sans passer par un fichier :
#
#   kubectl -n podium create secret generic podium-discord \
#     --from-literal=DISCORD_CLIENT_ID='ton-client-id' \
#     --from-literal=DISCORD_CLIENT_SECRET='ton-client-secret' \
#     --from-literal=ADMIN_DISCORD_IDS='ton-identifiant-discord' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Des que ce secret existe, la connexion par mot de passe est fermee : Discord
# devient la seule porte d'entree. ADMIN_DISCORD_IDS (identifiants utilisateur
# Discord, separes par des virgules) rend ces comptes administrateurs.
#   kubectl -n podium rollout restart deploy/podium
apiVersion: v1
kind: Secret
metadata:
  name: podium-discord
  namespace: podium
type: Opaque
stringData:
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  ADMIN_DISCORD_IDS: ""
